name: Offline mock checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: factory
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U factory" --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://factory:ci-only@127.0.0.1:5432/factory
      TEST_DATABASE_URL: postgresql+psycopg://factory:ci-only@127.0.0.1:5432/factory
      OPERATOR_TOKEN: ci-operator-only
      WORKER_AUTH_TOKEN: ci-worker-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: python -m pip install -r requirements.lock
      - run: python -m ruff check . && python -m ruff format --check .
      - run: python -m mypy factory
      - run: python -m alembic upgrade head
      - run: python -m pytest -q --cov=factory
      - run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8080 &
          api=$!
          trap 'kill "$api"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/health/ready; then break; fi
            sleep 1
          done
          python -m scripts.demo
          python -m scripts.recover
