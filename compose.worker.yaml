
# PC B: existing image built locally; controller API is reachable only over private LAN/Tailscale.
services:
  worker:
    image: ai-content-factory-local
    build: .
    command: ["python", "-m", "factory.generator"]
    restart: unless-stopped
    environment:
      WORKER_ID: ${WORKER_ID:-worker-b}
      WORKER_API_URL: ${WORKER_API_URL:?Set the controller private URL}
      WORKER_AUTH_TOKEN: ${WORKER_AUTH_TOKEN:?Set the shared worker token}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      ASR_MODEL_ROOT: /app/data/models
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_REQUEST_TIMEOUT: ${OLLAMA_REQUEST_TIMEOUT:-180}
      CLIPS_MAX_SOURCE_BYTES: ${CLIPS_MAX_SOURCE_BYTES:-2147483648}
      CLIPS_SCRATCH_BUDGET_BYTES: ${CLIPS_SCRATCH_BUDGET_BYTES:-8589934592}
      CLIPS_DISK_RESERVE_BYTES: ${CLIPS_DISK_RESERVE_BYTES:-4294967296}
    volumes:
      - asr-models:/app/data/models
    depends_on:
      - ollama
  ollama:
    image: ollama/ollama:0.13.0
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
volumes:
  asr-models:
  ollama-models:
